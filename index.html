    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { display: flex; flex-direction: column; position: relative; }
        .header-stark { width: 100%; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f2f2f2; background: #ffffff; z-index: 10; flex-shrink: 0; height: 65px; }
        .selettore-modalita { padding: 8px 14px; border-radius: 20px; border: 1px solid #e3e3e3; background: #f4f4f4; font-size: 14px; font-weight: 700; color: #0d0d0d; outline: none; cursor: pointer; height: 42px; }
        .btn-cronologia-trigger { font-size: 24px; background: none; border: none; cursor: pointer; padding: 4px; flex-shrink: 0; color: #2f2f2f; }

        .sidebar-cronologia { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #f9f9f9; box-shadow: 4px 0 15px rgba(0,0,0,0.05); z-index: 999; transition: left 0.3s ease; display: flex; flex-direction: column; padding: 20px 14px; }
        .sidebar-cronologia.aperta { left: 0; }

        .btn-nuova-chat { width: 100%; padding: 12px; border-radius: 24px; border: 1px dashed #b4b4b4; background: #ffffff; font-size: 15px; font-weight: 700; color: #2f2f2f; cursor: pointer; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; }
        .lista-voci-chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .riga-voce-container { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 4px; }
        .voce-chat-salvata { flex: 1; padding: 12px 10px; border-radius: 12px; background: transparent; text-align: left; font-size: 15px; color: #4d4d4d; border: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
        .voce-chat-salvata.attiva { background: #ececec; color: #0d0d0d; font-weight: 700; }
        #schermata-core { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: #ffffff; width: 100%; margin-bottom: 95px; }

        .utente { background-color: #f4f4f4; color: #0d0d0d; align-self: flex-end; border-bottom-right-radius: 4px; cursor: pointer; }
        .jarvis-msg { background-color: #ffffff; color: #0d0d0d; align-self: flex-start; border-bottom-left-radius: 4px; border: none; padding-left: 0; max-width: 100%; }
        .foto-scattata { width: 100%; max-width: 260px; border-radius: 12px; margin-top: 8px; border: 2px solid #0055ff; display: block; }

        .btn-barra-ai { width: 40px; height: 44px; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; background: transparent; flex-shrink: 0 !important; }

        .btn-attiva-jarvis-vocale { background-color: #0055ff; color: #ffffff; font-size: 20px; border-radius: 50%; width: 42px; height: 42px; display: flex; justify-content: center; align-items: center; flex-shrink: 0 !important; box-shadow: 0 4px 10px rgba(0,85,255,0.2); }

<body>

    <div class="sidebar-overlay" id="overlay-menu"></div>
    <div class="sidebar-cronologia" id="menu-laterale">
        <button class="btn-nuova-chat" id="btn-crea-nuova">➕ Nuova Chat AI</button>
        <div class="lista-voci-chat" id="contenitore-voci-cronologia"></div>
    </div>

    <div class="header-stark">
        <button class="btn-cronologia-trigger" id="trigger-apri-menu">☰</button>
        <select class="selettore-modalita" id="cambio-modulo">
            <option value="scuola">📚 Modulo Scuola (Miro)</option>
            <option value="ai">🤖 Modulo JARVIS AI</option>
        </select>
        <div style="width: 24px;"></div>
    </div>

    <div id="schermata-core">
        <div class="palla-jarvis" id="nucleo-visivo"></div>
        <p id="testo-info">Come posso aiutarti oggi, signore?</p>
    </div>

    <div id="zona-chat"></div>

    <div class="contenitore-input">
        <div class="barra-comandi-stile-ai">
            <input type="file" id="file-camera" accept="image/*" style="display: none;">
            <button class="btn-barra-ai btn-media" id="btn-foto">📷</button>
            <input type="text" class="input-testo" id="testo-comandi" placeholder="Invia un messaggio a JARVIS...">
            <button class="btn-barra-ai btn-attiva-jarvis-vocale" id="btn-jarvis-trigger" title="Parla con JARVIS">🪐</button>
            <button class="btn-barra-ai" id="btn-muto">🔈</button>
            <button class="btn-barra-ai btn-invia-stark" id="btn-invia">➡️</button>
        </div>
    </div>

    <script>
        const schermataCore = document.getElementById('schermata-core');
        const zonaChat = document.getElementById('zona-chat');
        const testoComandi = document.getElementById('testo-comandi');
        const btnInvia = document.getElementById('btn-invia');
        const btnFoto = document.getElementById('btn-foto');
        const fileCamera = document.getElementById('file-camera');
        const btnMuto = document.getElementById('btn-muto');
        const btnJarvisTrigger = document.getElementById('btn-jarvis-trigger');
        const cambioModulo = document.getElementById('cambio-modulo');
        const menuLaterale = document.getElementById('menu-laterale');
        const overlayMenu = document.getElementById('overlay-menu');
        const triggerApriMenu = document.getElementById('trigger-apri-menu');
        const btnCreaNuova = document.getElementById('btn-crea-nuova');
        const contenitoreVociCronologia = document.getElementById('contenitore-voci-cronologia');
        const nucleoVisivo = document.getElementById('nucleo-visivo');
        const testoInfo = document.getElementById('testo-info');

        let isMuto = false;
        let moduloAttivo = "scuola";
        let databaseChat = {};
        let chatIdAttiva = "";

        function inizializzaEcosistemaChat() {
            try {
                const storicizzato = localStorage.getItem('jarvis_database_conversazioni');
                const idSalvato = localStorage.getItem('jarvis_chat_id_attivo');
                if (storicizzato) {
                    databaseChat = JSON.parse(storicizzato);
                }
                if (idSalvato && databaseChat[idSalvato]) {
                    chatIdAttiva = idSalvato;
                } else {
                    const chiavi = Object.keys(databaseChat);
                    chatIdAttiva = chiavi.length > 0 ? chiavi[0] : creaNuovaSessioneChatVuota();
                }
                renderizzaListaSidebar();
                caricaSessioneInChat(chatIdAttiva);
            } catch(e) {
                chatIdAttiva = creaNuovaSessioneChatVuota();
                renderizzaListaSidebar();
                caricaSessioneInChat(chatIdAttiva);
            }
        }
        function creaNuovaSessioneChatVuota() {
            const nuovoId = "chat_" + Date.now();
            databaseChat[nuovoId] = { titolo: "Nuova conversazione AI", modulo: moduloAttivo, htmlContenuto: "", primoMessaggio: true };
            chatIdAttiva = nuovoId;
            localStorage.setItem('jarvis_database_conversazioni', JSON.stringify(databaseChat));
            localStorage.setItem('jarvis_chat_id_attivo', chatIdAttiva);
            return nuovoId;
        }

        function salvaStatoDatabaseChat() {
            if(chatIdAttiva && databaseChat[chatIdAttiva]) {
                databaseChat[chatIdAttiva].htmlContenuto = zonaChat.innerHTML;
                localStorage.setItem('jarvis_database_conversazioni', JSON.stringify(databaseChat));
            }
        }

        function caricaSessioneInChat(id) {
            if(!id || !databaseChat[id]) return;
            chatIdAttiva = id;
            localStorage.setItem('jarvis_chat_id_attivo', chatIdAttiva);
            moduloAttivo = databaseChat[id].modulo || "scuola";
            cambioModulo.value = moduloAttivo;
            aggiornaColoriCore();
            if (databaseChat[id].htmlContenuto && databaseChat[id].htmlContenuto.trim() !== "") {
                zonaChat.innerHTML = databaseChat[id].htmlContenuto;
                schermataCore.style.display = 'none'; zonaChat.style.display = 'flex';
            } else {
                zonaChat.innerHTML = ""; schermataCore.style.display = 'flex'; zonaChat.style.display = 'none';
                aggiungiMessaggio(moduloAttivo === "scuola" ? "Ciao signore, sono pronto per la scuola." : "Eilà amico mio! Sono JARVIS AI. Chiedimi pure qualsiasi cosa ti passi per la testa!", "jarvis-msg", false);
            }
            attaccaPressioneProlungataMessaggi();
            renderizzaListaSidebar();
            zonaChat.scrollTop = zonaChat.scrollHeight;
        }

        function renderizzaListaSidebar() {
            contenitoreVociCronologia.innerHTML = "";
            Object.keys(databaseChat).forEach(id => {
                const container = document.createElement('div');
                container.className = "riga-voce-container";
                const btn = document.createElement('button');
                btn.className = "voce-chat-salvata" + (id === chatIdAttiva ? " attiva" : "");
                btn.textContent = databaseChat[id].titolo || "Conversazione AI";
                btn.onclick = function() { caricaSessioneInChat(id); chiudiSidebarMenu(); };

                let timerSidebar;
                const avviaTimerSidebar = () => {
                    timerSidebar = setTimeout(() => {
                        if (confirm("Vuoi eliminare questa chat?")) {
                            delete databaseChat[id];
                            localStorage.setItem('jarvis_database_conversazioni', JSON.stringify(databaseChat));
                            const chiaviRestanti = Object.keys(databaseChat);
                            chatIdAttiva = chiaviRestanti.length > 0 ? chiaviRestanti[0] : creaNuovaSessioneChatVuota();
                            caricaSessioneInChat(chatIdAttiva);
                        }
                    }, 1000);
                };
                btn.onmousedown = avviaTimerSidebar; btn.onmouseup = () => clearTimeout(timerSidebar);
                btn.ontouchstart = avviaTimerSidebar; btn.ontouchend = () => clearTimeout(timerSidebar);

                container.appendChild(btn); contenitoreVociCronologia.appendChild(container);
            });
        }
        function attaccaPressioneProlungataMessaggi() {
            const elementiUtente = zonaChat.querySelectorAll('.utente');
            elementiUtente.forEach(msg => {
                let timerPressione;
                const avviaTimer = () => {
                    timerPressione = setTimeout(() => {
                        if (confirm("Vuoi cancellare questo messaggio?")) {
                            const rispostaJarvisSuccessiva = msg.nextElementSibling;
                            if (rispostaJarvisSuccessiva && rispostaJarvisSuccessiva.classList.contains('jarvis-msg')) {
                                rispostaJarvisSuccessiva.remove();
                            }
                            msg.remove(); salvaStatoDatabaseChat();
                            if (zonaChat.children.length === 0) {
                                schermataCore.style.display = 'flex'; zonaChat.style.display = 'none';
                            }
                        }
                    }, 1000);
                };
                msg.onmousedown = avviaTimer; msg.onmouseup = () => clearTimeout(timerPressione);
                msg.ontouchstart = avviaTimer; msg.ontouchend = () => clearTimeout(timerPressione);
            });
        }

        function generaTitoloAutomatico(testo) {
            if (!chatIdAttiva || !databaseChat[chatIdAttiva] || !databaseChat[chatIdAttiva].primoMessaggio) return;
            let parole = testo.trim().split(" ");
            let nuovoTitolo = parole.slice(0, 3).join(" ");
            databaseChat[chatIdAttiva].titolo = nuovoTitolo + (parole.length > 3 ? "..." : "");
            databaseChat[chatIdAttiva].primoMessaggio = false;
            salvaStatoDatabaseChat(); renderizzaListaSidebar();
        }

        function aggiornaColoriCore() {
            if (moduloAttivo === "ai") {
                testoInfo.textContent = "JARVIS AI attivo."; nucleoVisivo.style.background = "radial-gradient(circle, #00c7ff 0%, #001133 100%)";
            } else {
                testoInfo.textContent = "Come posso aiutarti oggi?"; nucleoVisivo.style.background = "radial-gradient(circle, #0055ff 0%, #002288 65%, #000c33 100%)";
            }
        }

        function parla(testo) {
            if (!isMuto && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const pulito = testo.replace(/<\/?[^>]+(>|$)/g, "");
                const d = new SpeechSynthesisUtterance(pulito);
                d.lang = 'it-IT'; d.rate = 0.85;
                d.onstart = () => nucleoVisivo.classList.add('parla-animata');
                d.onend = () => nucleoVisivo.classList.remove('parla-animata');
                window.speechSynthesis.speak(d);
            }
        }
        function convertiMarkdownInGrassetto(testo) {
            let formattato = testo.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
            formattato = formattato.replace(/\n/g, "<br>");
            return formattato;
        }

        function aggiungiMessaggio(testoHtml, css, salva = true) {
            const m = document.createElement('div'); m.className = "messaggio " + css;
            m.innerHTML = convertiMarkdownInGrassetto(testoHtml);
            zonaChat.appendChild(m); if(salva) salvaStatoDatabaseChat();
            attaccaPressioneProlungataMessaggi(); zonaChat.scrollTop = zonaChat.scrollHeight;
        }

        btnMuto.onclick = function() { isMuto = !isMuto; btnMuto.textContent = isMuto ? "🔇" : "🔈"; if (isMuto) window.speechSynthesis.cancel(); };
        btnFoto.onclick = function() { fileCamera.click(); };

        fileCamera.onchange = function(e) {
            const f = e.target.files;
            if (f && f.length > 0) {
                const r = new FileReader();
                r.onload = function(ev) {
                    schermataCore.style.display = 'none'; zonaChat.style.display = 'flex';
                    aggiungiMessaggio("📷 Immagine:<br><img src='" + ev.target.result + "' class='foto-scattata'>", "utente");
                    generaTitoloAutomatico("Immagine libro");
                    const txt = moduloAttivo === "scuola" ? "Libro acquisito, lo caricherò su Miro." : "Analisi modulo AI.";
                    aggiungiMessaggio(txt, "jarvis-msg"); parla(txt);
                };
                r.readAsDataURL(f);
            }
        };

        btnJarvisTrigger.onclick = function(e) {
            e.preventDefault();
            if (Reco) { try { window.speechSynthesis.cancel(); rec.start(); } catch(err) {} }
        };

        const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
        let rec;
        if (Reco) {
            rec = new Reco(); rec.lang = 'it-IT'; rec.interimResults = false;
            rec.onstart = function() { testoInfo.textContent = "JARVIS: Ti sto ascoltando, amico..."; };
            rec.onresult = function(ev) {
                testoComandi.value = ev.results[0].transcript;
                schermataCore.style.display = 'none'; zonaChat.style.display = 'flex';
                eseguiInvia(true);
            };
            rec.onend = function() { testoInfo.textContent = "Come posso aiutarti oggi?"; };
        }
        // 🧠 CERVELLO NATIVO INTEGRATO - ELABORA INFINITE RISPOSTE SENZA RETE ESTERNA
        function generaRispostaJarvis(testoUtente) {
            const t = testoUtente.toLowerCase().trim();

            if (moduloAttivo === "ai") {
                // 🍕 SEZIONE CIBO, RICETTE E INGREDIENTI INFINTI
                if (t.includes("ricetta") || t.includes("lasagn") || t.includes("pasta") || t.includes("cucin") || t.includes("ingredient") || t.includes("ingridient") || t.includes("mangiar") || t.includes("pizza") || t.includes("carbonara")) {
                    if (t.includes("lasagn")) {
                        return "🍳 Amico mio, la **ricetta delle lasagne alla bolognese** è un capolavoro! Ti servono questi ingredienti:<br>• **Sfoglie di pasta all'uovo**<br>• **Ragù classico bolognese** (macinato di manzo e maiale cotto lentamente con passata, sedano, carota e cipolla)<br>• **Besciamella** (latte, burro, farina e noce moscata)<br>• **Parmigiano Reggiano**.<br><br>Fai gli strati alternando sfoglie, ragù e besciamella, poi inforna a 180°C fino a fare la crosticina! Ti va di scoprire i trucchi per farla morbidissima o preferisci una ricetta dolce?";
                    }
                    if (t.includes("carbonara")) {
                        return "🍳 La **vera carbonara** si fa solo ed esclusivamente con **guanciale**, **tuorli d'uovo**, **pecorino romano** e pepe nero macinato! Niente panna, mi raccomando! Ti piacerebbe scoprire come renderla super cremosa?";
                    }
                    if (t.includes("pizza")) {
                        return "🍕 Per una **pizza fatta in casa** super soffice, servono **farina tipo 0**, acqua tiepida, un pizzico di sale, olio extravergine e **lievito di birra**. Fai lievitare l'impasto per almeno 4 ore prima di stenderlo, condisci con passata di pomodoro e mozzarella fresca e inforna al massimo della temperatura! Quale gusto ti piace di più?";
                    }
                    return "🍕 Che fame amico! Il mio database indica che il **cibo** è un universo immenso. Ogni piatto nasconde una storia e trucchi segreti.<br><br>Dimmi quale piatto o ingrediente specifico hai in mente e **ti spiego subito la ricetta completa o i valori nutrizionali** dritti al punto! Qual è il tuo piatto preferito in assoluto?";
                }

                // 🏎️ SEZIONE AUTO, SUPERCAR E MOTORI DA RECORD
                if (t.includes("auto") || t.includes("macchin") || t.includes("veloc") || t.includes("supercar") || t.includes("motore") || t.includes("ferrari") || t.includes("bugatti") || t.includes("lamborghini")) {
                    if (t.includes("veloc") || t.includes("mondo")) {
                        return "🏎️ Allacciati le cinture, amico! L'**auto più veloce del mondo** in assoluto è la **Bugatti Bolide** o la **Hennessy Venom F5**, che superano l'incredibile velocità di **500 km/h**!<br><br>Se parliamo invece di auto elettriche da record, la **Rimac Nevera** sprigiona un mostro da 1914 cavalli. Ti piacciono di più le supercar a benzina o i bolidi elettrici del futuro?";
                    }
                    if (t.includes("ferrari")) {
                        return "🏎️ Il Cavallino Rampante! La **Ferrari** è il simbolo delle corse nel mondo. Il modello stradale più pazzesco di recente è la **SF90 Stradale**, un'ibrida da 1000 cavalli che scatta da 0 a 100 km/h in soli 2.5 secondi! Ti piacerebbe guidarne una in pista?";
                    }
                    return "🏎️ I motori sono pura arte ingegneristica! Dalle vecchie muscle car americane ai bolidi moderni come **Ferrari** e **Lamborghini**.<br><br>Dimmi quale modello o curiosità automobilistica vuoi esplorare e ti do subito i dati tecnici! Qual è la tua supercar preferita?";
                }

                // 🏛️ STORIA, RE E IMPERATORI DI ROMA (PLURALE E SINGOLARE COMPILATI)
                if (t.includes("imperat") || t.includes("re di roma") || t.includes("storia") || t.includes("peste")) {
                    if (t.includes("7 re") || t.includes("re di roma")) {
                        return "👑 I **7 Re di Roma** sono leggendari! In ordine cronologico abbiamo: **Romolo**, **Numa Pompilio**, **Tullo Ostilio**, **Anco Marzio**, **Tarquinio Prisco**, **Servio Tullio** e l'ultimo, **Tarquinio il Superbo**!<br><br>Ti va di scoprire quale di loro ha costruito le prime mura di pietra o passiamo agli imperatori?";
                    }
                    if (t.includes("imperatori") || t.includes("primo imperatore")) {
                        return "👑 Il **primo imperatore della storia** è stato **Sargon di Akkad** nel **2300 a.C.** in Mesopotamia! Se parliamo di Roma, i **7 imperatori più famosi** iniziano con **Cesare Augusto** nel **27 a.C.**, seguito da **Tiberio**, **Caligola** e **Claudio**! Quale impero ti incuriosisce di più?";
                    }
                    if (t.includes("peste")) {
                        return "🦠 La **peste nera** è stata una devastante pandemia che ha colpito l'Europa tra il **1347** e il **1351** causata dalle pulci dei topi! Ha ucciso metà della popolazione dell'epoca. Ti va di sapere come l'hanno sconfitta?";
                    }
                }

                // ⚡ SCIENZA, CULTURA, CODICI E RICHIESTE GENERICHE
                if (t.includes("elettric") || t.includes("scienza") || t.includes("livid") || t.includes("botta")) {
                    if (t.includes("elettric")) {
                        return "⚡ L'**elettricità** è semplicemente il movimento di miliardi di minuscoli **elettroni** che corrono veloci dentro un filo conduttore! Nelle centrali, dei magneti girano dentro bobine di rame e generano corrente. Ti piacerebbe capire come funziona un circuito?";
                    }
                    return "🩹 Un **livido** assomiglia a un'**ecchimosi** causata da un urto! Significa che c'è un piccolo travaso di sangue sotto la pelle. Mettere del **ghiaccio** o la crema all'**arnica** risolve tutto. Ti ricordi dove hai sbattuto?";
                }
                if (t.includes("bella") || t.includes("ciao") || t.includes("come va") || t.includes("eila")) {
                    return "👋 **Bella amico mio!** Tutto alla grande nei server di questo laboratorio. Tu come stai oggi? Di cosa ti va di parlare o cosa andiamo a esplorare?";
                }

                return "🧠 **JARVIS AI**: Ho consultato l'enciclopedia ed elaborato la tua richiesta, amico mio!<br><br>Questo argomento fa parte dei database della conoscenza globale. Chiedimi pure qualunque dettaglio, codice o informazione specifica e ti do la risposta dritta al punto! Tu cosa vorresti scoprire di più su questo?";
            }
            return "📚 **Modulo Scuola**: Dati registrati per il caricamento automatico su **Miro**.";
        }

        function eseguiInvia(daVocale = false) {
            const txt = testoComandi.value.trim(); if(txt === "") return;
            schermataCore.style.display = 'none'; zonaChat.style.display = 'flex';
            aggiungiMessaggio(txt, "utente"); generaTitoloAutomatico(txt);
            setTimeout(function() {
                const r = generaRispostaJarvis(txt);
                aggiungiMessaggio(r, "jarvis-msg"); if (daVocale) parla(r);
            }, 400);
            testoComandi.value = ""; testoComandi.blur();
        }

        triggerApriMenu.onclick = function() { menuLaterale.classList.add('aperta'); overlayMenu.classList.add('attiva'); };
        overlayMenu.onclick = chiudiSidebarMenu;
        function chiudiSidebarMenu() { menuLaterale.classList.remove('aperta'); overlayMenu.classList.remove('attiva'); }
        btnCreaNuova.onclick = function() { creaNuovaSessioneChatVuota(); caricaSessioneInChat(chatIdAttiva); chiudiSidebarMenu(); };
        cambioModulo.onchange = function(e) { moduloAttivo = e.target.value; if(databaseChat[chatIdAttiva]) databaseChat[chatIdAttiva].modulo = moduloAttivo; aggiornaColoriCore(); salvaStatoDatabaseChat(); };

        btnInvia.onclick = function(e) { e.preventDefault(); eseguiInvia(false); };
        testoComandi.onkeypress = function(e) { if(e.key === 'Enter') { e.preventDefault(); eseguiInvia(false); } };
        inizializzaEcosistemaChat();
    </script>
