<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        html, body { height: 100%; background-color: #ffffff; color: #1f1f1f; overflow: hidden; }
        body { display: flex; flex-direction: column; position: relative; }

        #schermata-core { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; transition: opacity 0.3s ease; }
        .palla-jarvis { width: 150px; height: 110px; background: radial-gradient(circle, #0046ff 0%, #001a66 70%, #000a26 100%); border-radius: 50%; box-shadow: 0 10px 40px rgba(0, 70, 255, 0.4); animation: pulsaVoce 2s infinite ease-in-out; }
        .palla-jarvis.ascolto { background: radial-gradient(circle, #ff0055 0%, #990033 70%, #330011 100%) !important; box-shadow: 0 10px 40px rgba(255, 0, 85, 0.6) !important; animation: pulsaAscolto 0.5s infinite ease-in-out !important; }
        @keyframes pulsaVoce { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.12); opacity: 1; } }
        @keyframes pulsaAscolto { 0%, 100% { transform: scale(1.1); } 50% { transform: scale(1.22); } }

        #zona-chat { display: none; flex: 1; flex-direction: column; padding: 16px; overflow-y: auto; background-color: #ffffff; }
        .messaggio { max-width: 80%; padding: 12px 16px; border-radius: 18px; margin-bottom: 12px; font-size: 16px; line-height: 1.4; word-break: break-word; }
        .utente { background-color: #f3f3f3; color: #1f1f1f; align-self: flex-end; border-bottom-right-radius: 4px; }
        .jarvis-msg { background-color: #ffffff; color: #1f1f1f; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #e3e3e3; }

        .barra-comandi { padding: 14px; display: flex; align-items: center; gap: 6px; border-top: 1px solid #f0f0f0; background-color: #ffffff; margin-bottom: env(safe-area-inset-bottom, 10px); position: relative; bottom: 0; width: 100%; }
        .input-testo { flex: 1; padding: 12px 16px; border: 1px solid #e3e3e3; border-radius: 24px; font-size: 15px; outline: none; background-color: #f9f3f3; transition: border 0.2s; -webkit-appearance: none; }
        .input-testo:focus { border-color: #0046ff; background-color: #ffffff; }
        .btn-tondo { width: 44px; height: 44px; border-radius: 50%; border: none; background-color: #0046ff; color: white; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,70,255,0.1); flex-shrink: 0; }
    </style>
</head>
<body>

    <div id="schermata-core">
        <div class="palla-jarvis" id="nucleo-visivo"></div>
        <p id="testo-info" style="margin-top: 20px; color: #8e8e93; font-size: 13px; text-align: center; padding: 0 10px;">Tocca il microfono per parlare o la barra per scrivere</p>
    </div>

    <div id="zona-chat"></div>

    <div class="barra-comandi">
        <input type="file" id="file-camera" accept="image/*" multiple style="display: none;">
        <button class="btn-tondo" id="btn-foto" style="background-color: #34c759;" title="Scatta foto libro">📷</button>
        <button class="btn-tondo" id="btn-mic" style="background-color: #00c7ff;" title="Parla a JARVIS">🎤</button>

        <input type="text" class="input-testo" id="testo-comandi" placeholder="Chiedi a JARVIS o aggiungi foto...">
        <button class="btn-tondo" id="btn-invia">➡️</button>
    </div>

    <script>
        const schermataCore = document.getElementById('schermata-core');
        const zonaChat = document.getElementById('zona-chat');
        const testoComandi = document.getElementById('testo-comandi');
        const btnInvia = document.getElementById('btn-invia');
        const btnFoto = document.getElementById('btn-foto');
        const fileCamera = document.getElementById('file-camera');
        const btnMic = document.getElementById('btn-mic');
        const nucleoVisivo = document.getElementById('nucleo-visivo');
        const testoInfo = document.getElementById('testo-info');

        let archivioFotoScuola = [];

        function caricaCronologia() {
            const salvato = localStorage.getItem('jarvis_cronologia_chat');
            if (salvato) {
                zonaChat.innerHTML = salvato;
                if (zonaChat.children.length > 0) {
                    schermataCore.style.display = 'none';
                    zonaChat.style.display = 'flex';
                }
            } else {
                aggiungiMessaggio("Ciao signore, sono pronto e operativo al suo servizio. Quale schema andiamo a sviluppare per la scuola?", "jarvis-msg");
            }
            zonaChat.scrollTop = zonaChat.scrollHeight;
        }

        function salvaCronologia() {
            localStorage.setItem('jarvis_cronologia_chat', zonaChat.innerHTML);
        }

        function aggiungiMessaggio(testoHtml, classeCss) {
            const msg = document.createElement('div');
            msg.className = `messaggio ${classeCss}`;
            msg.innerHTML = testoHtml;
            zonaChat.appendChild(msg);
            salvaCronologia();
            zonaChat.scrollTop = zonaChat.scrollHeight;
        }

        testoComandi.addEventListener('focus', () => {
            schermataCore.style.display = 'none';
            zonaChat.style.display = 'flex';
        });

        btnFoto.addEventListener('click', () => { fileCamera.click(); });
        fileCamera.addEventListener('change', (e) => {
            const files = e.target.files;
            for(let i=0; i<files.length; i++) {
                archivioFotoScuola.push(files[i]);
                aggiungiMessaggio(`📷 Foto caricata nella coda memoria libro: <b>${files[i].name}</b>`, "utente");
            }
            schermataCore.style.display = 'none';
            zonaChat.style.display = 'flex';
        });

        const RiconoscimentoVocale = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (RiconoscimentoVocale) {
            const riconoscimento = new RiconoscimentoVocale();
            riconoscimento.lang = 'it-IT';
            riconoscimento.interimResults = false;

            btnMic.addEventListener('click', () => {
                try { riconoscimento.start(); } catch(e) { }
            });

            riconoscimento.onstart = () => {
                nucleoVisivo.classList.add('ascolto');
                testoInfo.textContent = "JARVIS: Ti sto ascoltando, signore...";
                testoInfo.style.color = "#ff0055";
            };

            riconoscimento.onresult = (event) => {
                testoComandi.value = event.results[0].transcript;
                schermataCore.style.display = 'none';
                zonaChat.style.display = 'flex';
                eseguiInvia();
            };

            riconoscimento.onend = () => {
                nucleoVisivo.classList.remove('ascolto');
                testoInfo.textContent = "Tocca il microfono per parlare o la barra per scrivere";
                testoInfo.style.color = "#8e8e93";
            };

            riconoscimento.onerror = () => { nucleoVisivo.classList.remove('ascolto'); };
        } else {
            btnMic.style.display = 'none';
        }

        btnInvia.addEventListener('click', eseguiInvia);
        testoComandi.addEventListener('keypress', (e) => { if(e.key === 'Enter') eseguiInvia(); });

        function eseguiInvia() {
            const testo = testoComandi.value.trim();
            if(testo === "" && archivioFotoScuola.length === 0) return;

            schermataCore.style.display = 'none';
            zonaChat.style.display = 'flex';

            if(testo !== "") {
                aggiungiMessaggio(testo, "utente");
            }

            if(archivioFotoScuola.length > 0) {
                aggiungiMessaggio(`Signore, ho ricevuto il pacchetto con <b>${archivioFotoScuola.length} foto</b> del libro. Le ho salvate nella cartella memoria Cloud. Appena accenderai il laboratorio a casa, le proietterò su Miro creando lo schema.`, "jarvis-msg");
                archivioFotoScuola = [];
            } else {
                aggiungiMessaggio("Richiesta vocale o testuale ricevuta al sicuro, signore. Quando sarai davanti al PC fisso collegheremo i database.", "jarvis-msg");
            }

            testoComandi.value = "";
        }

        caricaCronologia();
    </script>
</body>
</html>
