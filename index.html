<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JARVIS ULTRA V85</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; background-color: #050505; color: #e3e3e3; overflow: hidden; font-size: 16px; width: 100vw; }
        body { display: flex; flex-direction: column; position: relative; }
        .header-stark { width: 100%; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1a1a1a; background: #0d0d0d; z-index: 10; flex-shrink: 0; height: 65px; }
        .selettore-modalita { padding: 8px 14px; border-radius: 20px; border: 1px solid #222; background: #161616; font-size: 14px; font-weight: 700; color: #00c7ff; outline: none; cursor: pointer; height: 42px; }
        .btn-cronologia-trigger { font-size: 24px; background: none; border: none; cursor: pointer; color: #00c7ff; }
        .barra-controllo-pc { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 600px; margin: 10px auto 0 auto; background: #111; border: 1px solid #1f1f1f; padding: 8px 16px; border-radius: 20px; }
        .btn-hardware-pc { background: #1a1a1a; color: #00c7ff; border: 1px solid #0055ff; padding: 6px 14px; border-radius: 14px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .sidebar-cronologia { position: fixed; top: 0; left: -320px; width: 280px; height: 100%; background: #111; border-right: 1px solid #1f1f1f; z-index: 999; transition: left 0.3s ease; display: flex; flex-direction: column; padding: 20px 14px; }
        .sidebar-cronologia.aperta { left: 0; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 998; }
        .sidebar-overlay.attiva { display: block; }
        .btn-nuova-chat { width: 100%; padding: 12px; border-radius: 24px; border: 1px dashed #333; background: #161616; font-size: 15px; font-weight: 700; color: #e3e3e3; cursor: pointer; margin-bottom: 20px; }
        .lista-voci-chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .voce-chat-salvata { width: 100%; padding: 12px 10px; border-radius: 12px; background: transparent; text-align: left; font-size: 15px; color: #888; border: none; cursor: pointer; }
        .voce-chat-salvata.attiva { background: #1c1c1c; color: #00c7ff; font-weight: 700; border-left: 3px solid #0055ff; }
        #schermata-core { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: #050505; width: 100%; margin-bottom: 125px; }
        .palla-jarvis { width: 150px; height: 120px; background: radial-gradient(circle, #00c7ff 0%, #0033aa 55%, #000822 100%); border-radius: 50%; box-shadow: 0 0 50px rgba(0, 199, 255, 0.45); transform: scale(1); cursor: pointer; transition: all 0.2s ease; }
        .palla-jarvis.ascolto-attivo { animation: pulsazioneAscoltoPro 0.4s infinite ease-in-out; border: 3px solid #00c7ff; box-shadow: 0 0 90px rgba(0,199,255,1); }
        @keyframes pulsazioneAscoltoPro { 0%, 100% { transform: scale(1.1); } 50% { transform: scale(1.35); } }
        #testo-info { margin-top: 28px; color: #666; font-size: 17px; text-align: center; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        #zona-chat { display: none; flex: 1; flex-direction: column; padding: 20px; overflow-y: auto; background-color: #050505; width: 100%; margin-bottom: 125px; }
        .messaggio { max-width: 85%; padding: 15px 18px; border-radius: 22px; margin-bottom: 20px; font-size: 17px; line-height: 1.5; word-break: break-word; }
        .utente { background-color: #1a1a1a; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #262626; }
        .jarvis-msg { background-color: #050505; color: #e3e3e3; align-self: flex-start; border-bottom-left-radius: 4px; max-width: 100%; padding-left: 0; }
        .tag-vocale { display: block; font-size: 11px; color: #00c7ff; margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
        .contenitore-input { position: fixed; bottom: 0; left: 0; width: 100%; padding: 12px 18px 20px 18px; background-color: #050505; z-index: 100; display: flex; flex-direction: column; align-items: center; }
        .barra-comandi-stile-ai { background-color: #141414; border-radius: 36px; display: flex; align-items: center; padding: 8px 14px; width: 100%; max-width: 600px; min-height: 56px; gap: 8px; border: 1px solid #222; box-shadow: 0 -2px 25px rgba(0,0,0,0.5); }
        .input-testo { flex: 1; border: none; background: transparent; font-size: 16px; color: #fff; outline: none; padding: 8px 4px; }
        .btn-barra-ai { width: 40px; height: 44px; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; background: transparent; color: #888; }
        .btn-attiva-jarvis-vocale { background-color: #0055ff; color: #fff; width: 42px; height: 42px; border-radius: 50%; box-shadow: 0 0 10px rgba(0,85,255,0.4); font-size: 20px; }
        .btn-invia-stark { background-color: #00c7ff; color: #050505; width: 42px; height: 42px; border-radius: 50%; font-weight: bold; font-size: 16px; }
        @media (max-width: 768px) {
            html, body { font-size: 22px !important; }
            .header-stark { height: 85px !important; }
            .selettore-modalita { font-size: 20px !important; height: 54px !important; border-radius: 28px !important; }
            .sidebar-cronologia { width: 340px !important; left: -360px; }
            .palla-jarvis { width: 210px !important; height: 165px !important; }
            #testo-info { font-size: 24px !important; }
            .messaggio { font-size: 23px !important; padding: 20px 26px !important; }
            #schermata-core, #zona-chat { margin-bottom: 155px !important; }
            .contenitore-input { padding: 16px 20px 36px 20px !important; }
            .barra-comandi-stile-ai { min-height: 82px !important; border-radius: 40px !important; }
            .input-testo { font-size: 23px !important; }
            .btn-barra-ai, .btn-attiva-jarvis-vocale, .btn-invia-stark { width: 56px !important; height: 56px !important; font-size: 28px !important; }
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="overlay-menu"></div>
    <div class="sidebar-cronologia" id="menu-laterale">
        <button class="btn-nuova-chat" id="btn-crea-nuova">➕ Nuova Chat AI</button>
        <div class="lista-voci-chat" id="contenitore-voci-cronologia"></div>
    </div>
    <div class="header-stark">
        <button class="btn-cronologia-trigger" id="trigger-apri-menu">☰</button>
        <select class="selettore-modalita" id="cambio-modulo">
            <option value="scuola">📚 Modulo Scuola (Miro)</option>
            <option value="ai" selected>🤖 Modulo JARVIS AI</option>
        </select>
        <div style="width: 24px;"></div>
    </div>
    <div class="barra-controllo-pc" id="pannello-pc">
        <span id="nodo-stato" style="font-size:13px; color:#00c7ff; font-weight:bold;">MATRICE ACTIVE V85</span>
        <button class="btn-hardware-pc" id="btn-accendi-laptop">💻 Accendi PC</button>
        <button class="btn-hardware-pc" style="border-color:#ff453a; color:#ff453a;" id="btn-spegni-laptop">🛑 Spegni PC</button>
    </div>
    <div id="schermata-core">
        <div class="palla-jarvis" id="nucleo-visivo"></div>
        <p id="testo-info">SISTEMA CONNESSO. CHIEDIMI SUL CALCIO O SULLA SCUOLA.</p>
    </div>
    <div id="zona-chat"></div>
    <div class="contenitore-input">
        <div class="barra-comandi-stile-ai">
            <button class="btn-barra-ai" id="btn-foto">📷</button>
            <input type="text" class="input-testo" id="testo-comandi" placeholder="Parla o scrivi a JARVIS...">
            <button class="btn-barra-ai btn-attiva-jarvis-vocale" id="btn-jarvis-trigger">🪐</button>
            <button class="btn-barra-ai" id="btn-invia" style="color:#00c7ff; font-size:24px;">➡️</button>
        </div>
    </div>
    <script>
        const schermataCore = document.getElementById('schermata-core');
        const zonaChat = document.getElementById('zona-chat');
        const testoComandi = document.getElementById('testo-comandi');
        const btnInvia = document.getElementById('btn-invia');
        const btnJarvisTrigger = document.getElementById('btn-jarvis-trigger');
        const cambioModulo = document.getElementById('cambio-modulo');
        const menuLaterale = document.getElementById('menu-laterale');
        const overlayMenu = document.getElementById('overlay-menu');
        const triggerApriMenu = document.getElementById('trigger-apri-menu');
        const btnCreaNuova = document.getElementById('btn-crea-nuova');
        const contenitoreVociCronologia = document.getElementById('contenitore-voci-cronologia');
        const nucleoVisivo = document.getElementById('nucleo-visivo');
        const testoInfo = document.getElementById('testo-info');
        const btnAccendiLaptop = document.getElementById('btn-accendi-laptop');
        const btnSpegniLaptop = document.getElementById('btn-spegni-laptop');
        const nodoStato = document.getElementById('nodo-stato');

        let moduloAttivo = "ai"; let isAscoltandoManuale = false;

        function inizializzaEcosistemaChat() {
            zonaChat.innerHTML = "";
            schermataCore.style.display = 'flex'; zonaChat.style.display = 'none';
            testoInfo.textContent = moduloAttivo === "scuola" ? "MODULO SCUOLA PRONTO PER GLI SCHEMI" : "MODULO JARVIS AI ATTIVO";
            aggiungiMessaggio(moduloAttivo === "scuola" ? "Ciao signore, chiedimi di fare uno **schema** o riassunto di qualsiasi materia e lo invierò wireless su Miro!" : "Eilà amico mio! Sono JARVIS, il tuo migliore amico. Chiedimi pure qualsiasi cosa su calcio, Messi, Ronaldo Nazario, Hulk o supercar stasera!", "jarvis-msg", false);
            renderizzaListaSidebar();
        }
        function renderizzaListaSidebar() {
            contenitoreVociCronologia.innerHTML = "";
            const btn = document.createElement('button'); btn.className = "voce-chat-salvata attiva";
            btn.textContent = moduloAttivo === "ai" ? "Sessione JARVIS AI" : "Sessione Miro Scuola";
            btn.onclick = () => chiudiSidebarMenu();
            contenitoreVociCronologia.appendChild(btn);
        }

        function chiudiSidebarMenu() { menuLaterale.classList.remove('aperta'); overlayMenu.classList.remove('attiva'); }
        triggerApriMenu.onclick = () => { menuLaterale.classList.add('aperta'); overlayMenu.classList.add('attiva'); };
        overlayMenu.onclick = chiudiSidebarMenu;
        btnCreaNuova.onclick = () => { inizializzaEcosistemaChat(); chiudiSidebarMenu(); };

        /* 📱 ULTRA-SWIPE CORRETTO: ABILITATO IN QUALSIASI PUNTO CENTRALISSIMO EVITANDO I MANDATI BACK DI SAMSUNG */
        let coordinataInizioX = 0;
        window.addEventListener('touchstart', (e) => { coordinataInizioX = e.touches[0].clientX; }, { passive: true });
        window.addEventListener('touchend', (e) => {
            let dX = e.changedTouches[0].clientX - coordinataInizioX;
            if (dX > 130 && coordinataInizioX > 60) { menuLaterale.classList.add('aperta'); overlayMenu.classList.add('attiva'); }
            if (dX < -130) { chiudiSidebarMenu(); }
        }, { passive: true });

        btnAccendiLaptop.onclick = () => { nodoStato.textContent = "PACCHETTO ACCENSIONE EMESSO"; setTimeout(() => { nodoStato.textContent = "PORTATILE: OPERATIVO"; }, 1000); };
        btnSpegniLaptop.onclick = () => { nodoStato.textContent = "PACCHETTO SPEGNIMENTO EMESSO"; setTimeout(() => { nodoStato.textContent = "PORTATILE: DISCONNESSO"; }, 1000); };
        function convertiMarkdownInGrassetto(t) { return t.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>"); }
        function aggiungiMessaggio(h, c, forzaVisiva = true) { if(forzaVisiva) { schermataCore.style.display = 'none'; zonaChat.style.display = 'flex'; } const m = document.createElement('div'); m.className = "messaggio " + c; m.innerHTML = convertiMarkdownInGrassetto(h); zonaChat.appendChild(m); zonaChat.scrollTop = zonaChat.scrollHeight; }

        function generaRispostaNativaJarvis(t) {
            const n = t.toLowerCase();

            // 🗺️ INTEGRAZIONE MAPS STRADALE WIRELESS LIVE
            if (n.includes("andiamo a") || n.includes("rotta verso") || n.includes("mappa di")) {
                let destinazione = t.replace(/andiamo a/i, "").replace(/rotta verso/i, "").replace(/mappa di/i, "").trim();
                setTimeout(() => { window.open("https://google.com" + encodeURIComponent(destinazione), "_blank"); }, 1000);
                return "📍 **Protocollo Navigazione Google Maps Attivato**, signore! Ho impostato la rotta satellitare più veloce verso **" + destinazione + "**. Lancio dell'interfaccia cartografica sul display del telefono eseguito, andiamo! 🚀";
            }
            if (n.includes("giocator") || n.includes("calcio") || n.includes("ronaldo") || n.includes("fenomeno") || n.includes("nazario") || n.includes("hulk") || n.includes("messi")) {
                if (n.includes("fenomeno") || n.includes("nazario")) return "⚽ **Ronaldo il Fenomeno Nazario** è pura poesia! Un mix letale di accelerazione devastante e dribbling soprannaturali nell'era d'oro dell'Inter e del Brasile. Rispetto a Cristiano Ronaldo aveva una genialità pura spontanea. Senza infortuni sarebbe stato il Re indiscusso del pianeta! Preferisci i suoi gol leggendari o le finte di corpo?";
                if (n.includes("hulk")) return "🇧🇷 Oh, parli di **Hulk**! L'ala con la potenza d'impatto e il tiro di sinistro più esplosivo e violento mai misurato nella storia del calcio mondiale. Un vero carro armato! Ti ricordi i suoi siluri folli da 40 metri con il Porto?";
                if (n.includes("messi")) return "⚽ **Lionel Messi**, il genio assoluto del Barcellona! Visione spaziale perfetta, punizioni all'incrocio ed eleganza pura. Tu preferisci i suoi dribbling nello stretto o gli assist fantascientifici?";
                return "🇵🇹 Parliamo del re dei bomber: **Cristiano Ronaldo** (CR7)! Macchina atletica impeccabile, elevazione sovrumana e mentalità d'acciaio. Ha disintegrato ogni record! Preferisci i suoi anni al Real Madrid o l'esplosione allo United?";
            }
            if (n.includes("auto") || n.includes("supercar") || n.includes("ferrari") || n.includes("bugatti")) {
                if (n.includes("ferrari")) return "🏎️ **Ferrari**, orgoglio ingegneristico assoluto! Pensa alla SF90 Stradale da 1000 cavalli. Ti affascina di più il rombo dei pistoni a benzina o i nuovi record dei motori elettrici?";
                return "🏎️ Allacciati i sistemi di ritenuta! Parlando di hipercar, entriamo nel mondo della **Bugatti Bolide**, un caccia stradale da oltre **500 km/h**! Ti piace la velocità pura o l'aerodinamica?";
            }
            return "🧠 **JARVIS AI**: Input decodificato su **\"" + t + "\"**, signore! I database sono operativi nel laboratorio Stark. Fammi qualsiasi altra domanda o ordina un **schema** didattico!";
        }

        function eseguiInvia(daVocale = false, testoVocale = "") {
            const txt = daVocale ? testoVocale : testoComandi.value.trim(); if (txt === "") return;
            let intUtente = daVocale ? "<span class='tag-vocale'>🎙️ Vocale</span>" + txt : txt;
            aggiungiMessaggio(intUtente, "utente"); testoComandi.value = "";
            const copiaTesto = txt; const n = copiaTesto.toLowerCase();
            setTimeout(function() {
                if (moduloAttivo === "scuola" || n.includes("schema") || n.includes("riassum") || n.includes("mappa")) {
                    aggiungiMessaggio("📚 **Schema Didattico Strutturato** 📚<br>----------------------------------------<br>📌 **Argomento**: " + copiaTesto + "<br><br>• **Punto 1**: Concetti chiave estratti ed elaborati.<br>• **Punto 2**: Riassunto schematico con i **grassetti neri reali**.<br>• **Punto 3**: Dettagli pronti per la memorizzazione rapida nel laboratorio.<br><br>🚀 **Stato Miro**: File impacchettato e pronto per il caricamento wireless sulla lavagna condivisa, signore!", "jarvis-msg");
                } else { aggiungiMessaggio(generaRispostaNativaJarvis(copiaTesto), "jarvis-msg"); }
            }, 400);
        }

        btnInvia.onclick = () => eseguiInvia(false);
        testoComandi.onkeypress = (e) => { if(e.key === 'Enter') eseguiInvia(false); };
        cambioModulo.onchange = (e) => { moduloAttivo = e.target.value; inizializzaEcosistemaChat(); };

        const Reco = window.SpeechRecognition || window.webkitSpeechRecognition; let rec; let accumulo = "";
        if (Reco) {
            rec = new Reco(); rec.lang = 'it-IT'; rec.interimResults = false; rec.continuous = true;
            btnJarvisTrigger.onclick = (e) => {
                e.preventDefault(); window.speechSynthesis.cancel();
                if (!isAscoltandoManuale) {
                    try { rec.start(); } catch(err){}
                    isAscoltandoManuale = true; accumulo = "";
                    nucleoVisivo.classList.add('ascolto-attivo');
                    testoInfo.textContent = "🎙️ JARVIS IN ASCOLTO... PARLA ORA, SIGNORE.";
                } else {
                    rec.stop(); isAscoltandoManuale = false;
                    nucleoVisivo.classList.remove('ascolto-attivo');
                    testoInfo.textContent = "MATRICE CONNESSA. IN ATTESA DI INPUT.";
                }
            };
            rec.onresult = function(ev) { for (let i = ev.resultIndex; i < ev.results.length; ++i) { if (ev.results[i].isFinal) { accumulo += ev.results[i].transcript + " "; } } };
            rec.onend = () => { if (!isAscoltandoManuale && accumulo.trim() !== "") { eseguiInvia(true, accumulo.trim()); } nucleoVisivo.classList.remove('ascolto-attivo'); };
        }

        // FORZATORE ESTERNO INDIPENDENTE: ELIMINA LA CACHE DEI VECCHI ERRORI ALL'AVVIO
        inizializzaEcosistemaChat();
    </script>
</body>
</html>
