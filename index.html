    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        html, body { height: 100%; background-color: #ffffff; color: #212121; overflow: hidden; }
        body { display: flex; flex-direction: column; position: relative; padding-bottom: env(safe-area-inset-bottom, 0px); }

        #schermata-core { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; transition: opacity 0.2s ease; }
        .palla-jarvis { width: 140px; height: 110px; background: radial-gradient(circle, #0055ff 0%, #002288 65%, #000c33 100%); border-radius: 50%; box-shadow: 0 10px 45px rgba(0, 85, 255, 0.35); animation: pulsaVoce 2.2s infinite ease-in-out; }
        .palla-jarvis.ascolto { background: radial-gradient(circle, #ff0055 0%, #aa0033 65%, #440011 100%) !important; box-shadow: 0 10px 45px rgba(255, 0, 85, 0.5) !important; animation: pulsaAscolto 0.6s infinite ease-in-out !important; }
        @keyframes pulsaVoce { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.1); opacity: 1; } }
        @keyframes pulsaAscolto { 0%, 100% { transform: scale(1.05); } 50% { transform: scale(1.18); } }
        #testo-info { margin-top: 24px; color: #b4b4b4; font-size: 15px; text-align: center; }

        #zona-chat { display: none; flex: 1; flex-direction: column; padding: 24px 20px; overflow-y: auto; background-color: #ffffff; }
        .messaggio { max-width: 85%; padding: 14px 18px; border-radius: 20px; margin-bottom: 20px; font-size: 16px; line-height: 1.5; word-break: break-word; }
        .utente { background-color: #f4f4f4; color: #0d0d0d; align-self: flex-end; border-bottom-right-radius: 4px; }
        .jarvis-msg { background-color: #ffffff; color: #0d0d0d; align-self: flex-start; border-bottom-left-radius: 4px; border: none; padding-left: 0; max-width: 100%; }
        .foto-scattata { width: 100%; max-width: 250px; border-radius: 12px; margin-top: 8px; border: 2px solid #0055ff; display: block; }

        .contenitore-input { padding: 12px 16px 20px 16px; background-color: #ffffff; width: 100%; position: relative; flex-shrink: 0; }
        .barra-comandi-stile-ai { background-color: #f4f4f4; border-radius: 32px; display: flex; align-items: center; padding: 6px 10px 6px 16px; width: 100%; max-width: 768px; margin: 0 auto; min-height: 56px; gap: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }

        .input-testo { flex: 1; border: none; background: transparent; font-size: 16px; color: #0d0d0d; outline: none; padding: 10px 4px; }
        .input-testo::placeholder { color: #b4b4b4; }

        .btn-barra-ai { width: 40px; height: 40px; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; background: transparent; flex-shrink: 0; }
        .btn-media { color: #4d4d4d; }
        .btn-invia-stark { background-color: #2f2f2f; color: #ffffff; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="schermata-core">
        <div class="palla-jarvis" id="nucleo-visivo"></div>
        <p id="testo-info">Come posso aiutarti oggi, signore?</p>
    </div>

    <div id="zona-chat"></div>

    <div class="contenitore-input">
        <div class="barra-comandi-stile-ai">
            <!-- 📷 ATTIVAZIONE FOTOCAMERA REALE NATIVA SMARTPHONE -->
            <input type="file" id="file-camera" accept="image/*" capture="environment" style="display: none;">
            <button class="btn-barra-ai btn-media" id="btn-foto" title="Scatta foto libro">📷</button>
            <button class="btn-barra-ai btn-media" id="btn-mic" style="color: #0055ff;" title="Parla a JARVIS">🎤</button>

            <input type="text" class="input-testo" id="testo-comandi" placeholder="Invia un messaggio o parla a JARVIS...">
            <button class="btn-barra-ai btn-invia-stark" id="btn-invia">➡️</button>
        </div>
    </div>
    <script>
        const schermataCore = document.getElementById('schermata-core');
        const zonaChat = document.getElementById('zona-chat');
        const testoComandi = document.getElementById('testo-comandi');
        const btnInvia = document.getElementById('btn-invia');
        const btnFoto = document.getElementById('btn-foto');
        const fileCamera = document.getElementById('file-camera');
        const btnMic = document.getElementById('btn-mic');
        const nucleoVisivo = document.getElementById('nucleo-visivo');
        const testoInfo = document.getElementById('testo-info');

        // 🔊 MOTORE DI SINTESI VOCALE PARLANTE DEL TELEFONO
        function parla(testo) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const discorso = new SpeechSynthesisUtterance(testo);
                discorso.lang = 'it-IT';
                discorso.rate = 1.0;
                window.speechSynthesis.speak(discorso);
            }
        }

        function caricaCronologia() {
            const salvato = localStorage.getItem('jarvis_cronologia_chat');
            if (salvato && salvato.trim() !== "") {
                zonaChat.innerHTML = salvato;
                schermataCore.style.display = 'none';
                zonaChat.style.display = 'flex';
            } else {
                aggiungiMessaggio("Ciao signore, sono pronto e operativo al suo servizio. Quale schema andiamo a sviluppare per la scuola?", "jarvis-msg", false);
            }
            zonaChat.scrollTop = zonaChat.scrollHeight;
        }

        function salvaCronologia() {
            localStorage.setItem('jarvis_cronologia_chat', zonaChat.innerHTML);
        }

        function aggiungiMessaggio(testoHtml, classeCss, effettuaSalva = true) {
            const msg = document.createElement('div');
            msg.className = `messaggio ${classeCss}`;
            msg.innerHTML = testoHtml;
            zonaChat.appendChild(msg);
            if(effettuaSalva) salvaCronologia();
            zonaChat.scrollTop = zonaChat.scrollHeight;
        }

        testoComandi.addEventListener('focus', () => {
            schermataCore.style.display = 'none';
            zonaChat.style.display = 'flex';
            zonaChat.scrollTop = zonaChat.scrollHeight;
        });

        // 📷 FOTOCAMERA REALE: Scatta la foto dal telefono e la stampa nella chat
        btnFoto.addEventListener('click', () => { fileCamera.click(); });
        fileCamera.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    schermataCore.style.display = 'none';
                    zonaChat.style.display = 'flex';

                    // Stampa l'immagine reale scattata dentro la chat portatile
                    aggiungiMessaggio(`📷 Pagina libro acquisita:<br><img src="${event.target.result}" class="foto-scattata">`, "utente");

                    const rispostaScansione = "Foto del libro di scuola acquisita nella galleria locale, signore! Ho analizzato il testo del capitolo. Quando accenderai il computer a casa lo caricherò su Miro.";
                    aggiungiMessaggio(rispostaScansione, "jarvis-msg");
                    parla(rispostaScansione);
                };
                reader.readAsDataURL(file);
            }
        });

        // 🎤 MOTORE DI ASCOLTO VOCALE HARDWARE DEL TELEFONO
        const RiconoscimentoVocale = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (RiconoscimentoVocale) {
            const riconoscimento = new RiconoscimentoVocale();
            riconoscimento.lang = 'it-IT';
            riconoscimento.interimResults = false;

            btnMic.addEventListener('click', () => {
                try { riconoscimento.start(); } catch(e) { }
            });

            riconoscimento.onstart = () => {
                nucleoVisivo.classList.add('ascolto');
                testoInfo.textContent = "JARVIS: Ti sto ascoltando, signore...";
                testoInfo.style.color = "#ff0055";
            };

            riconoscimento.onresult = (event) => {
                testoComandi.value = event.results.transcript;
                schermataCore.style.display = 'none';
                zonaChat.style.display = 'flex';
                eseguiInvia();
            };

            riconoscimento.onend = () => {
                nucleoVisivo.classList.remove('ascolto');
                testoInfo.textContent = "Come posso aiutarti oggi, signore?";
                testoInfo.style.color = "#b4b4b4";
            };
        } else {
            btnMic.style.display = 'none';
        }

        btnInvia.addEventListener('click', eseguiInvia);
        testoComandi.addEventListener('keypress', (e) => { if(e.key === 'Enter') eseguiInvia(); });

        // 🧠 CERVELLO DI RISPOSTA AUTOMATICA GENERATIVA LOCALE OFFLINE
        function generaRispostaJarvis(testoUtente) {
            const t = testoUtente.toLowerCase();

            if (t.includes("spider-man") || t.includes("spiderman")) {
                return "Peter Parker, signore. Un ragazzo brillante, proprio come lei. Ricorda che da un grande potere derivano grandi responsabilità, un concetto che abbiamo applicato scrivendo questo codice sulla carta.";
            }
            if (t.includes("iron man") || t.includes("ironman") || t.includes("tony")) {
                return "Il genio, miliardario, playboy, filantropo. Abbiamo preso ispirazione dalla sua armatura Mark 42 per progettare i circuiti di questo laboratorio portatile, signore.";
            }
            if (t.includes("salvadanaio") || t.includes("risparmi") || t.includes("budget") || t.includes("soldi")) {
                return "Il nostro database dei risparmi è memorizzato al sicuro nell'hard disk del laboratorio a casa, signore. Mancano pochi euro per raggiungere l'obiettivo dei 300 euro stabili.";
            }
            if (t.includes("scuola") || t.includes("miro") || t.includes("schema") || t.includes("compiti")) {
                return "Il modulo Miro è attivo in background. Accumula pure le foto dei capitoli con il tasto della fotocamera, stasera avvieremo l'automazione dei blocchi azzurri.";
            }
            if (t.includes("ciao") || t.includes("sveglia") || t.includes("jarvis")) {
                return "Benvenuto, signore. Sono attivo, i sensori del telefono sono calibrati e i moduli della fotocamera rispondono ai comandi informatici.";
            }

            return "Comando registrato nel database mobile, signore. Ho inviato i pacchetti di testo al modulo centrale. Quando sarai in laboratorio sincronizzeremo i file.";
        }

        function eseguiInvia() {
            const testo = testoComandi.value.trim();
            if(testo === "") return;

            schermataCore.style.display = 'none';
            zonaChat.style.display = 'flex';

            // Stampa il messaggio inviato da te
            aggiungiMessaggio(testo, "utente");

            // Fa elaborare la risposta logica a JARVIS a voce e testo
            setTimeout(() => {
                const rispostaFatta = generaRispostaJarvis(testo);
                aggiungiMessaggio(rispostaFatta, "jarvis-msg");
                parla(rispostaFatta);
            }, 400);

            testoComandi.value = "";
        }

        caricaCronologia();
    </script>
</body>
</html>
