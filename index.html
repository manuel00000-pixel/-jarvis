<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #ffffff; color: #1f1f1f; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Schermata Principale con JARVIS al centro */
        #schermata-core { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .palla-jarvis { width: 160px; height: 120px; background: radial-gradient(circle, #0046ff 0%, #001a66 70%, #000a26 100%); border-radius: 50%; box-shadow: 0 10px 40px rgba(0, 70, 255, 0.4); animation: pulsaVoce 2s infinite ease-in-out; }
        .palla-jarvis.ascolto { background: radial-gradient(circle, #ff0055 0%, #990033 70%, #330011 100%) !important; box-shadow: 0 10px 40px rgba(255, 0, 85, 0.6) !important; animation: pulsaAscolto 0.5s infinite ease-in-out !important; }
        @keyframes pulsaVoce { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.15); opacity: 1; } }
        @keyframes pulsaAscolto { 0%, 100% { transform: scale(1.1); } 50% { transform: scale(1.25); } }

        /* Area Chat a Scomparsa stile ChatGPT */
        #zona-chat { display: none; flex: 1; flex-direction: column; padding: 20px; overflow-y: auto; background-color: #ffffff; }
        .messaggio { max-width: 80%; padding: 12px 16px; border-radius: 18px; margin-bottom: 12px; font-size: 16px; line-height: 1.4; }
        .utente { background-color: #f3f3f3; color: #1f1f1f; align-self: flex-end; border-bottom-right-radius: 4px; }
        .jarvis-msg { background-color: #ffffff; color: #1f1f1f; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #e3e3e3; }

        /* Barra Inferiore dell'Input */
        .barra-comandi { padding: 16px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #f0f0f0; background-color: #ffffff; }
        .input-testo { flex: 1; padding: 14px 20px; border: 1px solid #e3e3e3; border-radius: 28px; font-size: 16px; outline: none; background-color: #f9f3f3; transition: border 0.2s; }
        .input-testo:focus { border-color: #0046ff; background-color: #ffffff; }
        .btn-tondo { width: 46px; height: 48px; border-radius: 50%; border: none; background-color: #0046ff; color: white; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,70,255,0.1); }
    </style>
</head>
<body>

    <!-- 🪐 STATO DI CALMA: JARVIS AL CENTRO SU SFONDO BIANCO -->
    <div id="schermata-core">
        <div class="palla-jarvis" id="nucleo-visivo"></div>
        <p id="testo-info" style="margin-top: 25px; color: #8e8e93; font-size: 14px;">Tocca il mic per parlare o la barra per scrivere</p>
    </div>

    <!-- 💬 MODALITÀ CHAT: CRONOLOGIA DEI MESSAGGI A SCOMPARSA -->
    <div id="zona-chat">
        <div class="messaggio jarvis-msg">Ciao signore, sono pronto e operativo al suo servizio. Quale schema andiamo a sviluppare per la scuola?</div>
    </div>

    <!-- 🛠️ BARRA DI COMANDO INFERIORE -->
    <div class="barra-comandi">
        <input type="file" id="file-camera" accept="image/*" multiple style="display: none;">
        <button class="btn-tondo" id="btn-foto" style="background-color: #34c759;" title="Scatta foto libro">📷</button>
        <button class="btn-tondo" id="btn-mic" style="background-color: #00c7ff;" title="Parla a JARVIS">🎤</button>

        <input type="text" class="input-testo" id="testo-comandi" placeholder="Chiedi a JARVIS o aggiungi foto libro...">
        <button class="btn-tondo" id="btn-invia">➡️</button>
    </div>
    <script>
        const schermataCore = document.getElementById('schermata-core');
        const zonaChat = document.getElementById('zona-chat');
        const testoComandi = document.getElementById('testo-comandi');
        const btnInvia = document.getElementById('btn-invia');
        const btnFoto = document.getElementById('btn-foto');
        const fileCamera = document.getElementById('file-camera');
        const btnMic = document.getElementById('btn-mic');
        const nucleoVisivo = document.getElementById('nucleo-visivo');
        const testoInfo = document.getElementById('testo-info');

        let archivioFotoScuola = [];

        // 🦾 TRANSIZIONE CHAT: Se tocchi la barra, JARVIS sparisce e si apre la chat
        testoComandi.addEventListener('focus', () => {
            schermataCore.style.display = 'none';
            zonaChat.style.display = 'flex';
        });

        // 📷 FOTOCAMERA SCUOLA
        btnFoto.addEventListener('click', () => { fileCamera.click(); });
        fileCamera.addEventListener('change', (e) => {
            const files = e.target.files;
            for(let i=0; i<files.length; i++) {
                archivioFotoScuola.push(files[i]);
                const notifica = document.createElement('div');
                notifica.className = 'messaggio utente';
                notifica.innerHTML = `📷 Foto caricata nella coda memoria libro: <b>${files[i].name}</b>`;
                zonaChat.appendChild(notifica);
            }
            schermataCore.style.display = 'none';
            zonaChat.style.display = 'flex';
            zonaChat.scrollTop = zonaChat.scrollHeight;
        });

        // 🎤 PROTOCOLLO ASCOLTO VOCE MOBILE PER SMARTPHONE
        const RiconoscimentoVocale = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (RiconoscimentoVocale) {
            const riconoscimento = new RiconoscimentoVocale();
            riconoscimento.lang = 'it-IT';
            riconoscitoreContinuous = false;
            riconoscimento.interimResults = false;

            btnMic.addEventListener('click', () => {
                try {
                    riconoscimento.start();
                } catch(e) { }
            });

            riconoscimento.onstart = () => {
                nucleoVisivo.classList.add('ascolto'); // La palla diventa rossa e pulsa velocemente in ascolto
                testoInfo.textContent = "JARVIS: Ti sto ascoltando, signore...";
                testoInfo.style.color = "#ff0055";
            };

            riconoscimento.onresult = (event) => {
                const voceTrascritto = event.results[0][0].transcript;
                testoComandi.value = voceTrascritto;

                // Fa scattare la transizione visiva e invia il testo detto a voce nella chat
                schermataCore.style.display = 'none';
                zonaChat.style.display = 'flex';
                eseguiInvia();
            };

            riconoscimento.onend = () => {
                nucleoVisivo.classList.remove('ascolto');
                testoInfo.textContent = "Tocca il mic per parlare o la barra per scrivere";
                testoInfo.style.color = "#8e8e93";
            };

            riconoscimento.onerror = () => {
                nucleoVisivo.classList.remove('ascolto');
            };
        } else {
            btnMic.style.display = 'none'; // Nasconde il tasto se il browser è vecchissimo e non supporta l'audio
        }

        // ➡️ INVIO COMANDI
        btnInvia.addEventListener('click', eseguiInvia);
        testoComandi.addEventListener('keypress', (e) => { if(e.key === 'Enter') eseguiInvia(); });

        function eseguiInvia() {
            const testo = testoComandi.value.trim();
            if(testo === "" && archivioFotoScuola.length === 0) return;

            schermataCore.style.display = 'none';
            zonaChat.style.display = 'flex';

            if(testo !== "") {
                const msgUtente = document.createElement('div');
                msgUtente.className = 'messaggio utente';
                msgUtente.textContent = testo;
                zonaChat.appendChild(msgUtente);
            }

            const rispJarvis = document.createElement('div');
            rispJarvis.className = 'messaggio jarvis-msg';

            if(archivioFotoScuola.length > 0) {
                rispJarvis.innerHTML = `Signore, ho ricevuto il pacchetto con <b>${archivioFotoScuola.length} foto</b> del libro. Le ho salvate nella cartella memoria Cloud. Appena accenderai il laboratorio a casa, le proietterò su Miro creando lo schema.`;
                archivioFotoScuola = [];
            } else {
                rispJarvis.textContent = `Richiesta vocale ricevuta al sicuro, signore. Quando sarai davanti al PC fisso collegheremo i database.`;
            }

            zonaChat.appendChild(rispJarvis);
            testoComandi.value = "";
            zonaChat.scrollTop = zonaChat.scrollHeight;
        }
    </script>
</body>
</html>
